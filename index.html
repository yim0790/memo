<!-- 편한메모 - 비밀번호 잠금 메모장 PWA - 목록/상세/즐겨찾기/색상/검색/삭제/백업 단일 파일 앱 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>편한메모</title>
<meta name="description" content="간단한 개인 메모장">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3F51B5">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="편한메모">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;background:#fff;color:#111;font-size:15px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:#fff}
.screen.on{display:flex}
.bar{background:#5C6BC0;color:#fff;display:flex;align-items:center;gap:14px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));flex:0 0 auto}
.bar .ttl{font-size:17px;font-weight:600;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.bar .ic{padding:2px;cursor:pointer}
.bar .ic.act svg{fill:#FFD54F;stroke:#FFD54F}
#sbox{flex:1;border:0;background:rgba(255,255,255,.22);color:#fff;padding:7px 12px;border-radius:16px;font-size:15px;outline:none;min-width:0}
#sbox::placeholder{color:rgba(255,255,255,.75)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{padding:12px 16px;border-bottom:.5px solid #eee;cursor:pointer}
.row.ord{display:flex;align-items:center;gap:8px}
.row.ord .rc{flex:1;min-width:0}
.mv{width:36px;height:36px;flex:0 0 auto;border:1px solid #ccc;border-radius:6px;background:#fff;color:#3F51B5;font-size:14px;display:flex;align-items:center;justify-content:center}
.mv.off{color:#ddd;border-color:#eee}
.row .t{font-size:15px;color:#111;display:flex;align-items:center;gap:6px}
.row .d{font-size:11.5px;color:#999;margin-top:4px}
.row .st{width:14px;height:14px;fill:#F5A623;flex:0 0 auto}
.empty{text-align:center;color:#aaa;padding:60px 20px;font-size:14px;line-height:1.8}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#3F51B5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;border:0;box-shadow:0 3px 10px rgba(0,0,0,.28);cursor:pointer}
#dtitle{border:0;outline:none;background:transparent;font-size:17px;font-weight:600;color:#111;width:100%;padding:14px 16px 6px;font-family:inherit}
#dbody{border:0;outline:none;background:transparent;flex:1;width:100%;padding:6px 16px 20px;font-size:15px;line-height:1.7;color:#222;resize:none;font-family:inherit}
#pal{flex:0 0 auto;border-top:.5px solid #ddd;background:#fff;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:9px}
#pal.on{display:flex}
.prow{display:flex;align-items:center;gap:9px}
.plabel{font-size:12px;color:#888;flex:0 0 30px}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid #ccc;cursor:pointer;flex:0 0 auto}
.sw.sel{border:3px solid #3F51B5}
.tsw{width:28px;height:28px;border-radius:50%;border:1px solid #ccc;cursor:pointer;flex:0 0 auto}
.tsw.sel{border:3px solid #3F51B5}
.bbtn{margin-left:auto;min-width:38px;height:30px;padding:0 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#555;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.bbtn.sel{border:2px solid #3F51B5;background:#E8EAF6;color:#3F51B5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:0 22px;z-index:20}
.ov.on{display:flex}
.dlg{background:#fff;border-radius:8px;padding:20px 18px 12px;width:100%;max-width:340px}
.dlg h3{margin:0 0 16px;font-size:17px;font-weight:600}
.dlg input{width:100%;border:0;border-bottom:2px solid #3F51B5;outline:none;font-size:17px;padding:6px 0;margin-bottom:14px;background:transparent;font-family:inherit}
.dlg .msg{color:#D32F2F;font-size:13px;margin:-6px 0 12px;min-height:17px}
.dlg .btns{display:flex;justify-content:flex-end;gap:22px;padding-top:4px}
.dlg .btns button{border:0;background:transparent;color:#3F51B5;font-size:15px;font-weight:600;padding:8px 2px;cursor:pointer;font-family:inherit}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#F4F5F7;border-radius:16px 16px 0 0;padding:0 0 calc(8px + env(safe-area-inset-bottom));display:none;z-index:30;box-shadow:0 -3px 18px rgba(0,0,0,.22)}
.sheet.on{display:block}
.sheet .grab{height:4px;width:38px;border-radius:2px;background:#c9ccd1;margin:8px auto 6px;padding:0;border:0;cursor:default}
.sheet div{padding:15px 22px;font-size:15px;cursor:pointer;border-bottom:.5px solid #e3e5e9;color:#1f2430}
.sheet div:last-child{border:0}
.sheet .warn{color:#D32F2F}
</style>
</head>
<body>

<div id="s-lock" class="screen">
  <div class="bar"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span class="ttl">편한메모</span></div>
  <div class="ov on"><div class="dlg">
    <h3 id="ltl">비밀번호</h3>
    <input id="lpw" type="password" inputmode="numeric" autocomplete="off">
    <input id="lpw2" type="password" autocomplete="off" style="display:none">
    <div class="msg" id="lmsg"></div>
    <div class="btns"><button id="lgo">로그인</button></div>
  </div></div>
</div>

<div id="s-list" class="screen">
  <div class="bar">
    <span class="ttl" id="ltitle">내 메모</span>
    <input id="sbox" placeholder="검색" style="display:none">
    <span class="ic" id="bfav" title="즐겨찾기만"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg></span>
    <span class="ic" id="bsearch" title="검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
    <span class="ic" id="bmenu" title="메뉴"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></span>
    <span class="ic" id="bdone" style="display:none;font-size:15px;font-weight:600">완료</span>
  </div>
  <div class="body" id="rows"></div>
  <button class="fab" id="bnew">+</button>
</div>

<div id="s-note" class="screen">
  <div class="bar">
    <span class="ic" id="nback"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></span>
    <span class="ttl"></span>
    <span class="ic" id="nfav"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg></span>
    <span class="ic" id="npal"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.7 1.5-1.5 0-1.3 1-1.5 2-1.5H18a3 3 0 0 0 3-3 9 9 0 0 0-9-9z"/><circle cx="7.5" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="11" r="1"/></svg></span>
    <span class="ic" id="nmenu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></span>
  </div>
  <div class="body" id="nwrap" style="display:flex;flex-direction:column">
    <input id="dtitle" placeholder="제목">
    <textarea id="dbody" placeholder="내용"></textarea>
  </div>
  <div id="pal"></div>
</div>

<div class="ov" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="ov" id="ov2"><div class="dlg">
  <h3 id="d2t">비밀번호 변경</h3>
  <input id="d2a" type="password" placeholder="현재 비밀번호" autocomplete="off">
  <input id="d2b" type="password" placeholder="새 비밀번호" autocomplete="off">
  <input id="d2c" type="password" placeholder="새 비밀번호 확인" autocomplete="off">
  <div class="msg" id="d2m"></div>
  <div class="btns"><button id="d2x">취소</button><button id="d2o">확인</button></div>
</div></div>
<input type="file" id="fimp" accept="application/json,.json" style="display:none">

<script>
var COLORS=['#FFFFFF','#FDF6E3','#FFF1F0','#E8F5E9','#E3F2FD','#F3E5F5','#ECEFF1'];
var TCOLORS=['#222222','#D32F2F','#1565C0','#2E7D32','#757575'];
var K_AUTH='sm_auth', K_NOTES='sm_notes', K_FS='sm_fs';
var SIZES=[15,17,19,22], SNAMES=['작게','보통','크게','아주 크게'];
var notes=[], cur=null, favOnly=false, kw='', hidAt=0, LOCK_MS=60000, editOrd=false;
var $=function(i){return document.getElementById(i)};

/* ---------- 저장 ---------- */
function load(){try{notes=JSON.parse(localStorage.getItem(K_NOTES)||'[]')}catch(e){notes=[]}normOrd()}
// 순서값(ord)이 없는 옛 데이터는 즐겨찾기·최신순 기준으로 한 번만 번호를 매긴다
function normOrd(){
  var miss=false;
  for(var i=0;i<notes.length;i++){if(typeof notes[i].ord!=='number'||!isFinite(notes[i].ord)){miss=true;break}}
  if(!miss)return;
  var v=notes.slice().sort(function(a,b){return (b.fav?1:0)-(a.fav?1:0)||b.updated-a.updated});
  for(var k=0;k<v.length;k++)v[k].ord=k;
  save();
}
function save(){localStorage.setItem(K_NOTES,JSON.stringify(notes))}

/* ---------- 비밀번호 해시 (SHA-256 + salt) ---------- */
function hash(pw,salt){
  var d=new TextEncoder().encode(salt+'|'+pw);
  return crypto.subtle.digest('SHA-256',d).then(function(b){
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
  });
}
function newSalt(){
  var a=new Uint8Array(16);crypto.getRandomValues(a);
  return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}
function getAuth(){try{return JSON.parse(localStorage.getItem(K_AUTH))}catch(e){return null}}
function setAuth(pw){var s=newSalt();return hash(pw,s).then(function(h){localStorage.setItem(K_AUTH,JSON.stringify({s:s,h:h}))})}
function check(pw){var a=getAuth();if(!a)return Promise.resolve(false);return hash(pw,a.s).then(function(h){return h===a.h})}

/* ---------- 화면 전환 ---------- */
function show(id){['s-lock','s-list','s-note'].forEach(function(x){$(x).classList.toggle('on',x===id)})}

/* ---------- 잠금 ---------- */
function initLock(){
  var first=!getAuth();
  $('ltl').textContent=first?'비밀번호 설정':'비밀번호';
  $('lpw').placeholder=first?'새 비밀번호':'';
  $('lpw2').style.display=first?'block':'none';
  $('lpw2').placeholder='비밀번호 확인';
  $('lgo').textContent=first?'설정':'로그인';
  $('lpw').value='';$('lpw2').value='';$('lmsg').textContent='';
  show('s-lock');
  setTimeout(function(){$('lpw').focus()},250);
}
function doLock(){
  var first=!getAuth(), pw=$('lpw').value;
  if(!pw){$('lmsg').textContent='비밀번호를 입력하세요';return}
  if(first){
    if(pw!==$('lpw2').value){$('lmsg').textContent='두 비밀번호가 다릅니다';return}
    setAuth(pw).then(function(){unlock()});
  }else{
    check(pw).then(function(ok){ok?unlock():($('lmsg').textContent='비밀번호가 틀렸습니다',$('lpw').value='')});
  }
}
function unlock(){load();favOnly=false;kw='';closeSearch();if(editOrd)setOrdMode(false);render();show('s-list')}
$('lgo').onclick=doLock;
$('lpw').onkeydown=function(e){if(e.key==='Enter'){getAuth()?doLock():$('lpw2').focus()}};
$('lpw2').onkeydown=function(e){if(e.key==='Enter')doLock()};

/* ---------- 목록 ---------- */
function fmt(t){
  var d=new Date(t);
  return d.toLocaleDateString('ko-KR')+' '+d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function view(){
  var q=kw.trim().toLowerCase();
  return notes.filter(function(n){
    if(favOnly&&!n.fav)return false;
    if(q&&(n.title+' '+n.body).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return (b.fav?1:0)-(a.fav?1:0)||a.ord-b.ord});
}
function canMove(v,i,dir){var j=i+dir;return j>=0&&j<v.length&&!!v[i].fav===!!v[j].fav}
function render(){
  var v=view(), h='';
  for(var i=0;i<v.length;i++){
    var n=v[i], bg=n.color&&n.color!=='#FFFFFF';
    var inner='<div class="t">'+(n.fav?'<svg class="st" viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>':'')
      +esc(n.title||'(제목 없음)')+'</div><div class="d">'+fmt(n.updated)+'</div>';
    h+='<div class="row'+(editOrd?' ord':'')+'" data-id="'+n.id+'"'+(bg?' style="border-left:4px solid '+n.color+';background:'+n.color+'22"':'')+'>';
    h+=editOrd?('<div class="rc">'+inner+'</div>'
        +'<span class="mv'+(canMove(v,i,-1)?'':' off')+'" data-mv="-1">▲</span>'
        +'<span class="mv'+(canMove(v,i,1)?'':' off')+'" data-mv="1">▼</span>'):inner;
    h+='</div>';
  }
  if(!v.length)h='<div class="empty">'+(notes.length?'검색 결과가 없습니다':'메모가 없습니다<br>오른쪽 아래 + 를 눌러 시작하세요')+'</div>';
  $('rows').innerHTML=h;
  $('bfav').classList.toggle('act',favOnly);
}
$('rows').onclick=function(e){
  var r=e.target.closest('.row');if(!r)return;
  if(editOrd){
    var mv=e.target.closest('.mv');
    if(mv&&!mv.classList.contains('off'))move(r.dataset.id,parseInt(mv.dataset.mv,10));
    return;
  }
  open(notes.filter(function(n){return n.id===r.dataset.id})[0]);
};
// 화면에 보이는 순서 기준으로 이웃과 ord 값을 맞바꾼다 (즐겨찾기 그룹 안에서만 이동)
function move(id,dir){
  var v=view(), i=-1;
  for(var k=0;k<v.length;k++){if(v[k].id===id){i=k;break}}
  if(i<0||!canMove(v,i,dir))return;
  var a=v[i], b=v[i+dir], t=a.ord; a.ord=b.ord; b.ord=t;
  save();render();
}
$('bnew').onclick=function(){
  var mo=0;for(var i=0;i<notes.length;i++){if(notes[i].ord<mo)mo=notes[i].ord}
  var n={id:String(Date.now())+Math.random().toString(36).slice(2,7),title:'',body:'',color:'#FFFFFF',tcolor:'#222222',bold:false,fav:false,ord:mo-1,updated:Date.now()};
  notes.push(n);save();open(n);setTimeout(function(){$('dtitle').focus()},200);
};
$('bfav').onclick=function(){favOnly=!favOnly;render()};
$('bsearch').onclick=function(){
  if($('sbox').style.display==='none'){
    $('ltitle').style.display='none';$('sbox').style.display='block';$('sbox').focus();
  }else closeSearch();
};
function closeSearch(){$('sbox').style.display='none';$('sbox').value='';$('ltitle').style.display='';kw='';render()}
$('sbox').oninput=function(){kw=this.value;render()};

/* ---------- 상세 ---------- */
function open(n){
  cur=n;
  $('dtitle').value=n.title;$('dbody').value=n.body;
  paint();applyFs();$('pal').classList.remove('on');show('s-note');pushStep();
}
function paint(){
  $('nwrap').style.background=cur.color||'#FFFFFF';
  $('dbody').style.color=cur.tcolor||'#222222';
  $('dbody').style.fontWeight=cur.bold?'700':'400';
  $('nfav').classList.toggle('act',!!cur.fav);
  var h='<div class="prow"><span class="plabel">배경</span>';
  for(var i=0;i<COLORS.length;i++)h+='<span class="sw'+(COLORS[i]===cur.color?' sel':'')+'" data-c="'+COLORS[i]+'" style="background:'+COLORS[i]+'"></span>';
  h+='</div><div class="prow"><span class="plabel">글자</span>';
  for(var j=0;j<TCOLORS.length;j++)h+='<span class="tsw'+(TCOLORS[j]===(cur.tcolor||'#222222')?' sel':'')+'" data-t="'+TCOLORS[j]+'" style="background:'+TCOLORS[j]+'"></span>';
  h+='<span class="bbtn'+(cur.bold?' sel':'')+'" id="bbold">가</span></div>';
  $('pal').innerHTML=h;
}
function touch(){cur.updated=Date.now();save()}
$('dtitle').oninput=function(){cur.title=this.value;touch()};
$('dbody').oninput=function(){cur.body=this.value;touch()};
$('nback').onclick=function(){history.back()};
// 안드로이드 하드웨어 뒤로가기 대응 — 화면을 열 때 히스토리를 한 칸 쌓고, 뒤로가기로 되돌린다
function pushStep(){try{history.pushState({m:1},'')}catch(e){}}
function goList(){
  hideSheet();
  if(sheetOff){document.removeEventListener('click',sheetOff);sheetOff=null}
  $('ov2').classList.remove('on');$('pal').classList.remove('on');
  render();show('s-list');
}
function leaveNote(){
  if(cur&&!cur.title&&!cur.body)notes=notes.filter(function(n){return n.id!==cur.id});
  save();goList();
}
window.addEventListener('popstate',function(){
  if($('s-note').classList.contains('on')){leaveNote();return}
  if(editOrd){setOrdMode(false);return}
});
$('nfav').onclick=function(){cur.fav=!cur.fav;touch();paint()};
$('npal').onclick=function(){$('pal').classList.toggle('on')};
$('pal').onclick=function(e){
  var t=e.target;
  if(t.id==='bbold'){cur.bold=!cur.bold;touch();paint();return}
  if(t.dataset.c){cur.color=t.dataset.c;touch();paint();return}
  if(t.dataset.t){cur.tcolor=t.dataset.t;touch();paint()}
};
$('nmenu').onclick=function(){
  sheet([['삭제',function(){
    if(!confirm('이 메모를 삭제할까요?'))return;
    notes=notes.filter(function(n){return n.id!==cur.id});save();history.back();
  },true]]);
};

/* ---------- 시트 메뉴 ---------- */
var sheetOff=null;
function hideSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
function sheet(items){
  var s=$('sheet');
  if(sheetOff){document.removeEventListener('click',sheetOff);sheetOff=null}
  s.innerHTML='<span class="grab"></span>';
  items.forEach(function(it){
    var d=document.createElement('div');d.textContent=it[0];
    if(it[2])d.className='warn';
    d.onclick=function(){hideSheet();it[1]()};
    s.appendChild(d);
  });
  s.classList.add('on');$('scrim').classList.add('on');
  sheetOff=off;
  setTimeout(function(){document.addEventListener('click',off)},0);
  function off(e){if(!s.contains(e.target)){hideSheet();document.removeEventListener('click',off);sheetOff=null}}
}
function setOrdMode(v){
  editOrd=v;
  ['bfav','bsearch','bmenu'].forEach(function(x){$(x).style.display=v?'none':''});
  $('bdone').style.display=v?'':'none';
  $('ltitle').textContent=v?'순서 편집':'내 메모';
  render();
}
$('bdone').onclick=function(){history.back()};
$('bmenu').onclick=function(){
  sheet([
    ['순서 편집',function(){favOnly=false;closeSearch();setOrdMode(true);pushStep()}],
    ['글자 크기',fsDlg],
    ['비밀번호 변경',pwDlg],
    ['백업 내보내기',exp],
    ['백업 불러오기',function(){$('fimp').click()}]
  ]);
};

/* ---------- 글자 크기 ---------- */
function fsIdx(){var i=parseInt(localStorage.getItem(K_FS),10);return (i>=0&&i<SIZES.length)?i:1}
function applyFs(){$('dbody').style.fontSize=SIZES[fsIdx()]+'px'}
function fsDlg(){
  var c=fsIdx();
  sheet(SNAMES.map(function(n,i){return [(i===c?'\u2713 ':'')+n,function(){localStorage.setItem(K_FS,i);applyFs()}]}));
}

/* ---------- 비밀번호 변경 ---------- */
function pwDlg(){$('d2a').value='';$('d2b').value='';$('d2c').value='';$('d2m').textContent='';$('ov2').classList.add('on');$('d2a').focus()}
$('d2x').onclick=function(){$('ov2').classList.remove('on')};
$('d2o').onclick=function(){
  var a=$('d2a').value,b=$('d2b').value,c=$('d2c').value;
  if(!b){$('d2m').textContent='새 비밀번호를 입력하세요';return}
  if(b!==c){$('d2m').textContent='새 비밀번호가 서로 다릅니다';return}
  check(a).then(function(ok){
    if(!ok){$('d2m').textContent='현재 비밀번호가 틀렸습니다';return}
    setAuth(b).then(function(){$('ov2').classList.remove('on');alert('비밀번호를 변경했습니다')});
  });
};

/* ---------- 백업 ---------- */
function exp(){
  var d=new Date(),p=function(x){return String(x).padStart(2,'0')};
  var name='memo_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
  var blob=new Blob([JSON.stringify({v:1,exported:d.toISOString(),notes:notes},null,2)],{type:'application/json'});
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000);
}
$('fimp').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.notes))throw 0;
      if(!confirm('백업 파일의 메모 '+d.notes.length+'건으로 교체합니다.\n현재 메모 '+notes.length+'건은 사라집니다. 진행할까요?'))return;
      notes=d.notes.map(function(n){return {
        id:String(n.id||Date.now()+Math.random()),title:String(n.title||''),body:String(n.body||''),
        color:COLORS.indexOf(n.color)>=0?n.color:'#FFFFFF',tcolor:TCOLORS.indexOf(n.tcolor)>=0?n.tcolor:'#222222',bold:!!n.bold,
        fav:!!n.fav,ord:(typeof n.ord==='number'&&isFinite(n.ord))?n.ord:null,updated:Number(n.updated)||Date.now()};});
      normOrd();save();render();alert('메모 '+notes.length+'건을 불러왔습니다');
    }catch(e){alert('올바른 백업 파일이 아닙니다')}
  };
  r.readAsText(f);this.value='';
};

/* ---------- 자동 잠금 ---------- */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hidAt=Date.now()}
  else if(hidAt&&Date.now()-hidAt>LOCK_MS&&!$('s-lock').classList.contains('on')){
    $('sheet').classList.remove('on');$('ov2').classList.remove('on');initLock();
  }
});

applyFs();
initLock();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){console.log('SW 등록 실패:',err)});
  });
}
</script>
